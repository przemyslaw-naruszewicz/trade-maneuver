# RabbitMQ for integration messaging (ADR-0003). $(NAME) reads the environment variable NAME at startup.
#
# Users are seeded only when the node starts with an empty data volume, as PostgreSQL creates its users only on
# initialization. Exchanges, queues and bindings come from definitions.json on every start.

loopback_users = none

# The ADR-0003 memory threshold, absolute and below the container memory limit in compose.yaml.
vm_memory_high_watermark.absolute = 256MiB

definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# Users are seeded in the trade-maneuver vhost only. Seeding into both vhosts makes the concurrent import of the vhosts
# race and fail on RabbitMQ 4.2, so definitions.json grants the same permissions in trade-maneuver-testing, the vhost
# the tests use.

# Trade Maneuver consumes trade signals, inspects dead-lettered ones, and publishes signal outcomes.
default_users.trade-maneuver.password = $(RABBITMQ_PASSWORD)
default_users.trade-maneuver.vhost_pattern = ^trade-maneuver$
default_users.trade-maneuver.configure = ^$
default_users.trade-maneuver.write = ^tm\.signal-outcomes$
default_users.trade-maneuver.read = ^tm\.trade-signals\.(intake|dead-letter)$

# One producer user per analytics application: it publishes to tm.trade-signals and reads only its own outcome queue.
# No producer user has a tag, so none is an impersonator.
default_users.demo-analytics.password = $(DEMO_ANALYTICS_RABBITMQ_PASSWORD)
default_users.demo-analytics.vhost_pattern = ^trade-maneuver$
default_users.demo-analytics.configure = ^$
default_users.demo-analytics.write = ^tm\.trade-signals$
default_users.demo-analytics.read = ^tm\.signal-outcomes\..*$

default_users.demo-research.password = $(DEMO_RESEARCH_RABBITMQ_PASSWORD)
default_users.demo-research.vhost_pattern = ^trade-maneuver$
default_users.demo-research.configure = ^$
default_users.demo-research.write = ^tm\.trade-signals$
default_users.demo-research.read = ^tm\.signal-outcomes\..*$
