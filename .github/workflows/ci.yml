name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Infection on changed lines needs the merge base with origin/main.
          fetch-depth: 0

      - name: Validate CI configuration
        run: make ci-lint

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: storage/framework/cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build PHP image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/php/Dockerfile
          load: true
          tags: trade-maneuver-php:dev
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max,ignore-error=true,timeout=2m

      - name: Run local CI pipeline
        env:
          CI_SKIP_BUILD: '1'
          CI_WITH_MUTATION: ${{ github.event_name == 'pull_request' && 'diff' || '1' }}
        run: make ci

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: storage/quality/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop CI services
        if: always()
        run: docker compose down --remove-orphans

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Get the date for the Trivy cache key
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # A cache entry cannot be overwritten, so the first run of a day saves
      # the refreshed vulnerability database and later runs reuse it.
      - name: Cache Trivy database
        uses: actions/cache@v5
        with:
          path: storage/framework/cache/trivy
          key: ${{ runner.os }}-trivy-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build PHP image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/php/Dockerfile
          load: true
          tags: trade-maneuver-php:dev
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max,ignore-error=true,timeout=2m

      - name: Scan images
        env:
          CI_SKIP_BUILD: '1'
        run: make scan-images
