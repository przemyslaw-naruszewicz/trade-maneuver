name: ${COMPOSE_PROJECT_NAME:-trade-maneuver}

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: ${COMPOSE_PROJECT_NAME:-trade-maneuver}-php:dev
  working_dir: /var/www/html
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment: &php-environment
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    XDG_CONFIG_HOME: /tmp/.config
  volumes:
    - .:/var/www/html
  init: true

x-nginx: &nginx
  image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
  volumes:
    - .:/var/www/html:ro
    # The image writes the template to /etc/nginx/conf.d/default.conf with PHP_FPM_HOST filled in.
    - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  app:
    <<: *php
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    <<: *nginx
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      PHP_FPM_HOST: app
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: ${DB_DATABASE:-trade_maneuver}
      POSTGRES_USER: ${DB_USERNAME:-trade_maneuver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_trade_maneuver_password}
      POSTGRES_TEST_DB: trade_maneuver_testing
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2.9-alpine@sha256:cd4f5c5bb4ffe530dba84770a8d139b8518470cdd385fec9cf014ebfff6bb009
    # The node name, and so the data directory, depends on the host name.
    hostname: rabbitmq
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local_trade_maneuver_rabbitmq_password}
      DEMO_ANALYTICS_RABBITMQ_PASSWORD: ${DEMO_ANALYTICS_RABBITMQ_PASSWORD:-local_demo_analytics_password}
      DEMO_RESEARCH_RABBITMQ_PASSWORD: ${DEMO_RESEARCH_RABBITMQ_PASSWORD:-local_demo_research_password}
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  trade-signal-consumer:
    <<: *php
    command: ["php", "artisan", "trading:consume-trade-signals"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    restart: unless-stopped
    stop_grace_period: 100s
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  node:
    image: &node-image node:24.22.3-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The e2e profile runs the browser tests of bin/e2e against its own database, trade_maneuver_e2e.
  e2e-app:
    <<: *php
    profiles: [e2e]
    environment:
      <<: *php-environment
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_CONFIG_CACHE: /tmp/trade-maneuver-e2e-config.php
      # A path that does not exist, so the production build is served even while public/hot exists.
      APP_VITE_HOT_FILE: /tmp/trade-maneuver-e2e-no-hot-file
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: trade_maneuver_e2e
      DB_URL: ""
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_VHOST: trade-maneuver-testing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  e2e-nginx:
    <<: *nginx
    profiles: [e2e]
    environment:
      PHP_FPM_HOST: e2e-app
    # A static file, so that only the browser test of /up checks the way to PHP.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      e2e-app:
        condition: service_healthy

  e2e-node:
    image: *node-image
    profiles: [e2e]
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /var/www/html/storage/framework/cache/npm
    volumes:
      - .:/var/www/html
      # The development node service keeps using the working tree's node_modules.
      - e2e_node_modules:/var/www/html/node_modules
    init: true

  e2e-playwright:
    # The tag matches the exact @playwright/test version in package.json.
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    profiles: [e2e]
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://e2e-nginx
      # GitHub Actions sets CI, so that a test left with test.only fails the run.
      CI: ${CI:-}
    volumes:
      - .:/var/www/html
      - e2e_node_modules:/var/www/html/node_modules
      - ./docs/gui-design:/mockup:ro
    init: true

volumes:
  postgres_data:
  rabbitmq_data:
  e2e_node_modules:
