name: ${COMPOSE_PROJECT_NAME:-trade-maneuver}

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: ${COMPOSE_PROJECT_NAME:-trade-maneuver}-php:dev
  working_dir: /var/www/html
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    XDG_CONFIG_HOME: /tmp/.config
  volumes:
    - .:/var/www/html
  init: true

services:
  app:
    <<: *php
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-trade_maneuver}
      POSTGRES_USER: ${DB_USERNAME:-trade_maneuver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_trade_maneuver_password}
      POSTGRES_TEST_DB: trade_maneuver_testing
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2-alpine
    # The node name, and so the data directory, depends on the host name.
    hostname: rabbitmq
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local_trade_maneuver_rabbitmq_password}
      DEMO_ANALYTICS_RABBITMQ_PASSWORD: ${DEMO_ANALYTICS_RABBITMQ_PASSWORD:-local_demo_analytics_password}
      DEMO_RESEARCH_RABBITMQ_PASSWORD: ${DEMO_RESEARCH_RABBITMQ_PASSWORD:-local_demo_research_password}
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  trade-signal-consumer:
    <<: *php
    command: ["php", "artisan", "trading:consume-trade-signals"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-dispatcher:
    <<: *php
    command: ["php", "artisan", "trading:dispatch-outbox"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    stop_grace_period: 100s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
