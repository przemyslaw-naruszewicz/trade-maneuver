<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="build/tailwind.css">
<script src="theme.js" defer></script>
</head>
<body>
<div data-theme="light" class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
  <div class="flex grow flex-wrap">
    <section class="flex grow basis-[32rem] flex-col justify-between gap-12 bg-sunken p-6 text-ink lg:p-12" aria-label="Trade Maneuver">
      <p class="flex items-center gap-3 text-xs font-medium"><span class="sim-mark"></span>Simulated broker: no real orders</p>
      <div>
        <p class="inline-grid gap-3 font-display text-6xl leading-none tracking-tight lg:text-7xl"><span>Trade</span><span class="block h-0.5 bg-accent-mark"></span><span>Maneuver</span></p>
        <p class="mt-6 max-w-md text-sm text-pretty text-ink-muted">Trade Maneuver is a simulation, built as a portfolio and educational project. It has no connection to a real market, real funds, or a real brokerage account.</p>
      </div>
    </section>
    <main class="flex grow basis-[24rem] items-center justify-center p-6 lg:p-12">
      <form class="w-full max-w-sm">
        <h1 class="font-display text-5xl tracking-tight">Sign in</h1>
        <div class="mt-10 grid gap-6">
          <div>
            <label class="field-label" for="email">E-mail address</label>
            <input class="input" id="email" type="email" autocomplete="username">
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <input class="input" id="password" type="password" autocomplete="current-password">
          </div>
          <a class="btn btn-primary w-full" href="totp-challenge.html">Continue</a>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
