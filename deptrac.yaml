deptrac:
    paths:
        - app
        - bootstrap
        - config
        - database
        - routes
        - src
    exclude_files:
        - '#/bootstrap/cache/#'
    analyser:
        types:
            - class
            - file
            - function
            - function_call
    layers:
        - name: TradingDomain
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/Trading/Domain/'
        - name: TradingApplication
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/Trading/Application/'
        - name: TradingInfrastructure
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: '^%projectDirectory%/src/Trading/Infrastructure/'
                must_not:
                    - type: layer
                      value: TradingCompositionRoot
                    - type: layer
                      value: TradingReadModel
                    - type: layer
                      value: TradingQueryAdapter
        # ADR-0004: read-only Eloquent read models, which only Livewire components and query adapters may use.
        - name: TradingReadModel
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/Trading/Infrastructure/[^/]+/ReadModel/'
        # Query adapters, {Aggregate}Query in Infrastructure/{Aggregate}, which implement {Aggregate}QueryInterface.
        - name: TradingQueryAdapter
          collectors:
              - type: classLike
                value: '^TradeManeuver\\Trading\\Infrastructure\\[^\\]+\\[^\\]+Query$'
        - name: TradingUi
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: '^%projectDirectory%/src/Trading/Ui/'
                must_not:
                    - type: layer
                      value: TradingLivewire
        # Livewire components, the one part of Ui that may read through read models.
        - name: TradingLivewire
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/Trading/Ui/Livewire/'
        # Composition-root registration may reference concrete adapters and Ui classes.
        - name: TradingCompositionRoot
          collectors:
              - type: classLike
                value: '^TradeManeuver\\Trading\\Infrastructure\\Providers\\TradingServiceProvider$'
        # The demo analytics application: a stand-in analytics application in its own namespace, with the same layers.
        # No rule allows a dependency between it and Trading, in either direction.
        - name: DemoAnalyticsDomain
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/DemoAnalytics/Domain/'
        - name: DemoAnalyticsApplication
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/DemoAnalytics/Application/'
        - name: DemoAnalyticsInfrastructure
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: '^%projectDirectory%/src/DemoAnalytics/Infrastructure/'
                must_not:
                    - type: layer
                      value: DemoAnalyticsCompositionRoot
        - name: DemoAnalyticsUi
          collectors:
              - type: directory
                value: '^%projectDirectory%/src/DemoAnalytics/Ui/'
        - name: DemoAnalyticsCompositionRoot
          collectors:
              - type: classLike
                value: '^TradeManeuver\\DemoAnalytics\\Infrastructure\\Providers\\DemoAnalyticsServiceProvider$'
        - name: RootApplication
          collectors:
              - type: directory
                value: '^%projectDirectory%/(app|bootstrap|config|database|routes)/'
        # The Money and exact-arithmetic libraries selected in ADR-0005, allowed in the Domain.
        - name: MoneyLibrary
          collectors:
              - type: classLike
                value: '^Brick\\(Money|Math)\\'
        # PSR-20, the standard clock contract, allowed in the Application.
        - name: PsrClock
          collectors:
              - type: classLike
                value: '^Psr\\Clock\\'
        # PSR-3, the standard logger contract, allowed in the Application.
        - name: PsrLog
          collectors:
              - type: classLike
                value: '^Psr\\Log\\'
        # Every other class outside the project and PHP itself, so a new package stays out of the core until a task allows it.
        - name: ThirdParty
          collectors:
              - type: bool
                must:
                    - type: classLike
                      value: '.*'
                must_not:
                    - type: classLike
                      value: '^(App|Database|TradeManeuver)\\'
                    - type: layer
                      value: MoneyLibrary
                    - type: layer
                      value: PsrClock
                    - type: layer
                      value: PsrLog
                    - type: php_internal
                      value: '.*'
    ruleset:
        TradingDomain:
            - MoneyLibrary
        TradingApplication:
            - TradingDomain
            - PsrClock
            - PsrLog
        TradingInfrastructure:
            - TradingApplication
            - TradingDomain
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
        TradingReadModel:
            - ThirdParty
        TradingQueryAdapter:
            - TradingApplication
            - TradingDomain
            - TradingReadModel
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
        TradingUi:
            - TradingApplication
            - TradingDomain
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
        TradingLivewire:
            - TradingApplication
            - TradingDomain
            - TradingReadModel
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
        TradingCompositionRoot:
            - TradingApplication
            - TradingDomain
            - TradingInfrastructure
            - TradingQueryAdapter
            - TradingUi
            - TradingLivewire
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
        DemoAnalyticsDomain:
            - MoneyLibrary
        DemoAnalyticsApplication:
            - DemoAnalyticsDomain
            - PsrClock
        DemoAnalyticsInfrastructure:
            - DemoAnalyticsApplication
            - DemoAnalyticsDomain
            - MoneyLibrary
            - PsrClock
            - ThirdParty
        DemoAnalyticsUi:
            - DemoAnalyticsApplication
            - DemoAnalyticsDomain
            - MoneyLibrary
            - PsrClock
            - ThirdParty
        DemoAnalyticsCompositionRoot:
            - DemoAnalyticsApplication
            - DemoAnalyticsDomain
            - DemoAnalyticsInfrastructure
            - DemoAnalyticsUi
            - MoneyLibrary
            - PsrClock
            - ThirdParty
        RootApplication:
            - TradingCompositionRoot
            - DemoAnalyticsCompositionRoot
            - MoneyLibrary
            - PsrClock
            - PsrLog
            - ThirdParty
